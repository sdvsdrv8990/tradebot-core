# CI: Linux, gcc + clang (+ gcc/UBSan) — проект POSIX-only
# (epoll/eventfd/сокеты), Windows не целевая платформа.
# UBSan-нога не временная: UB уже дважды взрывался на стыке версий
# компиляторов (rotl64 x>>64; текущий кейс test_pub_freshness).
name: CI (Linux)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: gcc
            c: gcc
            cxx: g++
            flags: ""
          - name: clang
            c: clang
            cxx: clang++
            flags: ""
          - name: gcc-ubsan
            c: gcc
            cxx: g++
            flags: "-fsanitize=undefined -fno-sanitize-recover=all -g"

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_C_COMPILER=${{ matrix.c }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_C_FLAGS="${{ matrix.flags }}"
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
