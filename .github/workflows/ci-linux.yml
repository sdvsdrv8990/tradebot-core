# CI: Linux, gcc + clang — проект POSIX-only (epoll/eventfd/сокеты),
# Windows не целевая платформа. Стартер-шаблон GitHub заменён: без
# виндовой джобы, с выводом упавших тестов.
name: CI (Linux)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - c: gcc
            cxx: g++
          - c: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          cmake -B build -S .
          -DCMAKE_C_COMPILER=${{ matrix.c }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(nproc)"

      - name: Test
        working-directory: build
        run: ctest --output-on-failure
